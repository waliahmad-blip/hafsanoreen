<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>{{title}}</title></head>
<body style="margin:0;padding:0;background:#F7F3EE;font-family:'Lato',-apple-system,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F7F3EE;padding:40px 0;">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(43,39,36,0.08);">

<!-- Header -->
<tr><td style="background:linear-gradient(135deg,#2B2724,#1A1715);padding:32px 40px;text-align:center;">
<table width="100%"><tr><td align="center">
<span style="font-family:Georgia,serif;font-size:28px;color:#C9A87C;letter-spacing:4px;">HN</span>
<p style="font-family:Georgia,serif;font-size:11px;color:#A98052;letter-spacing:3px;text-transform:uppercase;margin:8px 0 0;">Hafsa Noreen Photography</p>
</td></tr></table>
</td></tr>

<!-- Hero Image -->
<tr><td style="line-height:0;">
<img src="{{heroImage}}" alt="" style="width:100%;height:auto;max-height:300px;object-fit:cover;display:block;">
</td></tr>

<!-- Content -->
<tr><td style="padding:40px;">
<h1 style="font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:400;color:#2B2724;margin:0 0 8px;line-height:1.3;">{{title}}</h1>
<p style="font-family:'Lato',sans-serif;font-size:14px;color:#A98052;margin:0 0 24px;letter-spacing:0.5px;">{{subtitle}}</p>
<div style="font-family:'Lato',sans-serif;font-size:15px;color:#3D3833;line-height:1.7;">{{body}}</div>

{{#ctaText}}
<!-- CTA Button -->
<table width="100%" cellpadding="0" cellspacing="0" style="margin:32px 0 0;">
<tr><td align="center">
<a href="{{ctaLink}}" style="display:inline-block;background:#A98052;color:#FFFFFF;padding:14px 40px;border-radius:4px;text-decoration:none;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;">{{ctaText}} →</a>
</td></tr>
</table>
{{/ctaText}}
</td></tr>

<!-- Divider -->
<tr><td style="padding:0 40px;"><hr style="border:none;border-top:1px solid rgba(169,128,82,0.2);margin:0;"></td></tr>

<!-- Footer -->
<tr><td style="padding:24px 40px;text-align:center;">
<p style="font-family:Georgia,serif;font-size:13px;color:#A98052;font-style:italic;margin:0 0 8px;">"Art is not what you see, but what you make others see." — Edgar Degas</p>
<p style="font-family:'Lato',sans-serif;font-size:11px;color:#9CAF9A;margin:0;">📍 Oakville, ON · 📞 <a href="tel:+16479093135" style="color:#9CAF9A;">(647) 909-3135</a></p>
<p style="font-family:'Lato',sans-serif;font-size:11px;color:#9CAF9A;margin:4px 0 0;">📧 <a href="mailto:hello@hafsanoreen.com" style="color:#9CAF9A;">hello@hafsanoreen.com</a> · 📷 <a href="https://instagram.com/hafsanoreenphotography" style="color:#9CAF9A;">@hafsanoreenphotography</a></p>
</td></tr>

</table>
</td></tr>
</table>
</body>
</html>
