<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="charcoalBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D2723"/>
      <stop offset="65%" stop-color="#1A1715"/>
      <stop offset="100%" stop-color="#100E0D"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED8A1"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#A98052"/>
      <stop offset="100%" stop-color="#805C30"/>
    </linearGradient>
    <linearGradient id="subtleGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A87C" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#EED8A1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A98052" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#charcoalBg)" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Outer Lens Knurling & Tick Marks -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#subtleGold)" stroke-width="1.5" stroke-dasharray="3 7"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.65"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="#C9A87C" stroke-width="1" opacity="0.3"/>

  <!-- 8 Subtle Aperture Blades -->
  <g opacity="0.18" stroke="url(#goldGrad)" stroke-width="1.5" fill="none">
    <path d="M 256 60 L 390 190"/>
    <path d="M 390 190 L 415 350"/>
    <path d="M 415 350 L 320 445"/>
    <path d="M 320 445 L 160 435"/>
    <path d="M 160 435 L 75 330"/>
    <path d="M 75 330 L 95 170"/>
    <path d="M 95 170 L 210 75"/>
    <path d="M 210 75 L 256 60"/>
  </g>

  <!-- Inner Golden Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>

  <!-- Diamond Star Accent at 12 o'clock -->
  <g transform="translate(256, 92)" fill="url(#goldGrad)">
    <polygon points="0,-14 4,-3 14,0 4,3 0,14 -4,3 -14,0 -4,-3"/>
  </g>

  <!-- Luxury HN Typography -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <!-- Letter H -->
    <path d="M 135 175 L 162 175 L 162 238 L 222 238 L 222 175 L 249 175 L 249 335 L 222 335 L 222 264 L 162 264 L 162 335 L 135 335 Z"/>
    <!-- Letter N -->
    <path d="M 272 175 L 301 175 L 349 276 L 349 175 L 375 175 L 375 335 L 347 335 L 298 232 L 298 335 L 272 335 Z"/>
  </g>

  <!-- Refined Bottom Arch Tag -->
  <text x="256" y="380" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" letter-spacing="9" fill="#EED8A1" opacity="0.95">STUDIO</text>

  <!-- Lens Optical Flare Dot -->
  <circle cx="256" cy="410" r="3" fill="#D4AF37" opacity="0.8"/>
</svg>