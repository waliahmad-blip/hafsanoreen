version: '3.8'
services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
      - FIRESTORE_EMULATOR_HOST=firestore:8080
    depends_on:
      - firestore
    volumes:
      - ./src:/app/src
    command: npx nodemon src/server.js

  firestore:
    image: google/cloud-sdk:emulators
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"